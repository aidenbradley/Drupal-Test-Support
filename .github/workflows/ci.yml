name: Test
on: [ push ]
jobs:
  build_production_module:
      name: Build Production Module
      runs-on: ubuntu-latest
      steps:
        -  name: Checkout module
           uses: actions/checkout@v2
           with:
             path: modules/test_support

        -  name: Cache module - Production Build
           id: build_production_module_cache
           uses: actions/cache@v3
           with:
             path: modules/test_support/vendor
             key: ${{ runner.os }}-build-production-module-composer-${{ hashFiles('modules/test_support/composer.lock') }}
             restore-keys: ${{ runner.os }}-build-production-module-composer-

        -  if: steps.build_production_module_cache.outputs.cache-hit != 'true'
           name: Build production module including dependencies
           run: |
               cd modules/test_support;
               composer --no-interaction --no-progress --prefer-dist --optimize-autoloader --no-dev install

  build_development_module:
      name: Build Development Module
      runs-on: ubuntu-latest
      steps:
          -   # This job never pinned a PHP version either (see the same fix
              # already applied to static_analysis_matrix), so it rode
              # ubuntu-latest's drifting default - a dependency not yet
              # declaring support for however new that's become breaks the
              # install outright (this module's own composer.json now also
              # pins config.platform.php to its own 7.3.0 floor, a different
              # but related safeguard: it stops `composer update` itself
              # silently resolving against whatever PHP ran it instead of
              # that floor). None of the PHP versions actually used
              # downstream (7.3, 8.1, 8.1.6, 8.2) need anything newer than
              # this; pin instead of riding the runner default.
              name: Setup PHP 8.1, with composer and extensions
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.1'
                  coverage: none

          -  name: Checkout module
             uses: actions/checkout@v2
             with:
                 path: modules/test_support

          -  name: Cache module - Development Build
             id: build_development_module_cache
             uses: actions/cache@v3
             with:
                 path: modules/test_support/vendor
                 key: ${{ runner.os }}-build-development-module-composer-${{ hashFiles('modules/test_support/composer.lock') }}
                 restore-keys: ${{ runner.os }}-build-development-module-composer-

          -   # tools/phpstan is a sibling of modules/test_support/vendor, not nested
              # inside it, so it needs its own cache entry, independent of the
              # main module vendor cache above. Restored before the install step
              # below so that step's condition can react to either cache missing.
              name: Cache static analysis tooling
              id: static_analysis_tooling_cache
              uses: actions/cache@v3
              with:
                  path: modules/test_support/tools/phpstan/vendor
                  key: ${{ runner.os }}-static-analysis-tooling-composer-${{ hashFiles('modules/test_support/tools/phpstan/composer.lock') }}
                  restore-keys: ${{ runner.os }}-static-analysis-tooling-composer-

          -   # Runs if EITHER cache missed, not just the main module one -
              # otherwise a tools/phpstan-only lock change (e.g. bumping
              # phpstan-drupal) would never retrigger the post-install-cmd hook
              # that rebuilds it, since the main module cache would still hit.
              # composer install is idempotent against an unchanged lock, so
              # this stays a faithful parity check of a developer's own
              # `composer install`, just correctly reactive to both locks.
              if: steps.build_development_module_cache.outputs.cache-hit != 'true' || steps.static_analysis_tooling_cache.outputs.cache-hit != 'true'
              name: Build development module including dependencies
              run: |
                 cd modules/test_support;
                 composer --no-interaction --no-progress --prefer-dist --optimize-autoloader install

  sanity_check:
    name: Sanity Check - Lint
    runs-on: ubuntu-latest
    # No longer needs build_development_module: it builds and validates
    # its own module vendor below, keyed by its own PHP version, rather
    # than trusting a cache built and validated only on a different one
    # (see the matching comment on drupal-9-matrix for the bug this
    # caused).
    strategy:
        matrix:
            php-versions: [ '7.3' ]
    steps:
        -   name: Setup PHP v${{ matrix.php-versions }}, with composer and extensions
            uses: shivammathur/setup-php@v2
            with:
                php-version: ${{ matrix.php-versions }}
                coverage: none

        -   name: Checkout module
            uses: actions/checkout@v2
            with:
                path: modules/test_support

        -   # Deliberately keyed by this job's own PHP version, not just
            # the lock hash - a cache built once on one PHP version must
            # never be silently trusted on another, since Composer only
            # validates platform requirements (the "php": ">=X" on each
            # locked package) against whichever PHP actually ran the
            # install. A lock that's secretly broken for this specific
            # PHP version would otherwise go uncaught, exactly as
            # happened when this module's own composer.lock briefly
            # locked packages requiring PHP >=7.4 while still declaring
            # (and claiming to support) a >=7.3.0 floor - invisible to
            # every job validated only on PHP 8.1+.
            id: module_vendor_cache
            name: Retreive module build cache
            uses: actions/cache@v3
            with:
                path: modules/test_support/vendor
                key: ${{ runner.os }}-module-vendor-composer-php${{ matrix.php-versions }}-${{ hashFiles('modules/test_support/composer.lock') }}
                restore-keys: ${{ runner.os }}-module-vendor-composer-php${{ matrix.php-versions }}-

        -   if: steps.module_vendor_cache.outputs.cache-hit != 'true'
            name: Build module including dependencies
            run: |
                cd modules/test_support;
                composer --no-interaction --no-progress --prefer-dist --optimize-autoloader install

        -   name: PHP Mess Detector
            uses: php-actions/phpmd@v1
            with:
                # PHPMD defaults to "latest", but its 3.0.0 release (Oct 2026)
                # restructured the CLI into Symfony Console subcommands, which
                # breaks php-actions/phpmd@v1's old positional-argument invocation
                # ("Command <path> is not defined"). Pin to the last 2.x release,
                # which still has the CLI this action expects.
                version: '2.15.0'
                # That version also requires PHP >=8.1 to even boot, independent
                # of the matrix PHP this job lints against — only affects the
                # isolated PHP php-actions/phpmd builds for itself, not the PHP
                # used to run the module's own test suite.
                php_version: '8.1'
                path: modules/test_support/tests/src/Traits
                output: ansi
                ruleset: modules/test_support/phpmd.xml

        -   name: PHP Code Smells
            run: cd modules/test_support; composer test:code-smells

  static_analysis_matrix:
    name: PHPStan - Static Analysis
    runs-on: ubuntu-latest
    needs: build_development_module
    strategy:
      fail-fast: false
      matrix:
        # A single fixed PHP version can't cover every Drupal major here:
        # drupal/core itself declares "php": ">=8.3.0" starting at 11.0.0 -
        # not something a later 11.x minor bumped, true since Drupal 11's
        # very first release (verified directly against drupal/drupal's own
        # committed composer.lock). PHP 8.1 (what this job always used)
        # can't even load Composer's own autoloader there, let alone run
        # anything meaningful - two different-looking failures turned out
        # to share this one root cause: 11.0.0/11.1.0 fail immediately via
        # Composer's own platform_check.php the moment phpstan-drupal's
        # bootstrap tries to load the surrounding site's autoloader, while
        # 11.2.0+ fail earlier still, via a PHP 8.3+ typed class constant
        # in drupal/core-recipe-unpack (the "recipes" feature) that PHP 8.1
        # can't even parse. 9.x/10.x have no such floor and stay on the
        # same PHP 8.1 this job has always used (see the comment on the
        # setup step below for why that specific version). Paired
        # explicitly via `include` rather than a second, independent
        # php-version axis, which would otherwise multiply into a full
        # cartesian product of every drupal-core against every version.
        include:
          - { drupal-core: '9.1.0', php-version: '8.1' }
          - { drupal-core: '9.2.0', php-version: '8.1' }
          - { drupal-core: '9.3.0', php-version: '8.1' }
          - { drupal-core: '9.4.0', php-version: '8.1' }
          - { drupal-core: '9.5.0', php-version: '8.1' }
          - { drupal-core: '10.0.0', php-version: '8.1' }
          - { drupal-core: '10.1.0', php-version: '8.1' }
          - { drupal-core: '10.2.0', php-version: '8.1' }
          - { drupal-core: '10.3.0', php-version: '8.1' }
          - { drupal-core: '10.4.0', php-version: '8.1' }
          - { drupal-core: '10.5.0', php-version: '8.1' }
          - { drupal-core: '10.6.0', php-version: '8.1' }
          - { drupal-core: '11.0.0', php-version: '8.3' }
          - { drupal-core: '11.1.0', php-version: '8.3' }
          - { drupal-core: '11.2.0', php-version: '8.3' }
          - { drupal-core: '11.3.0', php-version: '8.3' }
          - { drupal-core: '11.4.0', php-version: '8.3' }
          # Drupal 12.0.0 isn't released yet (scheduled for the week of
          # December 7, 2026, per drupal.org's own core release
          # schedule) - 12.0.0-rc1 is the latest real, installable tag
          # right now, both on Packagist and on drupal/drupal's own git
          # mirror this job's own checkout step below relies on.
          # drupal/core itself declares "php": ">=8.5.0" starting here.
          - { drupal-core: '12.0.0-rc1', php-version: '8.5' }
    steps:
        -   # This job never pinned a PHP version, so it silently rode whatever
            # ubuntu-latest's bundled default PHP happened to be. That default has
            # since moved past PHP 8.3, which added typed class constants — and the
            # exact pinned phpstan/phpstan + ondrejmirtes/better-reflection version
            # in composer.lock predates that, so its own internal reflection adapter
            # (ReflectionClass::IS_READONLY) fails with a declaration-incompatible
            # fatal error. Pin to a period-appropriate PHP instead of the drifting
            # runner default - now per Drupal major (see the matrix comment above),
            # rather than a single fixed version for every one.
            name: Setup PHP v${{ matrix.php-version }}, with composer and extensions
            uses: shivammathur/setup-php@v2
            with:
                php-version: ${{ matrix.php-version }}
                coverage: none

        -   name: Checkout Drupal core v${{ matrix.drupal-core }}
            uses: actions/checkout@v2
            with:
                repository: drupal/drupal
                ref: ${{ matrix.drupal-core }}

        -   name: Cache Drupal v${{ matrix.drupal-core }}
            id: build_drupal_cache
            uses: actions/cache@v3
            with:
                path: vendor
                key: ${{ runner.os }}-drupal-build-composer-v${{ matrix.drupal-core }}-${{ hashFiles('./composer.lock') }}
                restore-keys: ${{ runner.os }}-drupal-build-composer-v

        -   # Always runs, cache hit or not: composer config is cheap and
            # idempotent, and the composer.json it edits is a fresh checkout
            # every run anyway (not part of the cached vendor/ path), so a
            # cache hit would otherwise skip it and leave these unset before
            # the always-run core-dev install below.
            name: Allow Composer plugins (older Drupal core composer.json predates allow-plugins)
            run: |
              composer config allow-plugins true
              composer config policy.advisories.block false

        -   if: steps.build_drupal_cache.outputs.cache-hit != 'true'
            name: Install Drupal core dependencies
            run: composer --no-interaction --no-progress --prefer-dist --optimize-autoloader install

        -   # Deliberately not gated on the cache hit above, unlike the
            # plain `install` step. --with-all-dependencies resolves against
            # whatever's newest right now, not the frozen composer.lock this
            # job's cache is keyed on - caching it behind a key that can
            # never change (a released Drupal version's composer.lock is
            # immutable) would freeze that resolution the first time this
            # ever ran and silently never update again, masking real
            # dependency drift behind a permanently "warm" cache.
            name: Install drupal/core-dev with dependencies
            run: |
                composer --no-interaction --no-progress require --dev \
                drupal/core-dev:${{ matrix.drupal-core }} \
                phpspec/prophecy-phpunit:^2 --with-all-dependencies

        - name: Checkout module
          uses: actions/checkout@v2
          with:
            path: modules/test_support

        - name: Retreive module build cache
          uses: actions/cache@v3
          with:
            path: modules/test_support/vendor
            key: ${{ runner.os }}-build-development-module-composer-${{ hashFiles('modules/test_support/composer.lock') }}
            restore-keys: ${{ runner.os }}-build-development-module-composer-
            fail-on-cache-miss: true

        # tools/phpstan is a sibling of modules/test_support/vendor, not nested
        # inside it, so it needs its own cache entry. build_development_module
        # is what actually populates it (its own composer install there fires
        # the module's post-install-cmd hook, same as local dev), so this job
        # just restores that cache rather than installing it separately.
        - name: Retreive static analysis tooling build cache
          uses: actions/cache@v3
          with:
            path: modules/test_support/tools/phpstan/vendor
            key: ${{ runner.os }}-static-analysis-tooling-composer-${{ hashFiles('modules/test_support/tools/phpstan/composer.lock') }}
            restore-keys: ${{ runner.os }}-static-analysis-tooling-composer-
            fail-on-cache-miss: true

        - name: Run static analysis
          run: cd modules/test_support; composer test:types

  drupal-10-matrix:
    name: Drupal ${{ matrix.drupal-core }} - PHP ${{ matrix.php-versions }}
    runs-on: ubuntu-latest
    needs: [ sanity_check, static_analysis_matrix ]
    strategy:
      fail-fast: false
      matrix:
        drupal-core: [ '10.0.0', '10.1.0', '10.2.0', '10.3.0', '10.4.0', '10.5.0', '10.6.0' ]
        php-versions: [ '8.2', '8.1.6' ]
    steps:
      - name: Setup PHP v${{ matrix.php-versions }}, with composer and extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          coverage: none

      - name: Checkout Drupal core v${{ matrix.drupal-core }}
        uses: actions/checkout@v2
        with:
          repository: drupal/drupal
          ref: ${{ matrix.drupal-core }}

      -  name: Cache Drupal v${{ matrix.drupal-core }}
         id: build_drupal_cache
         uses: actions/cache@v3
         with:
           path: vendor
           key: ${{ runner.os }}-drupal-build-composer-v${{ matrix.drupal-core }}-${{ hashFiles('./composer.lock') }}
           restore-keys: ${{ runner.os }}-drupal-build-composer-v

      - # Always runs, cache hit or not - see the matching step in
        # static_analysis_matrix for why.
        name: Allow Composer plugins (older Drupal core composer.json predates allow-plugins)
        run: |
          composer config allow-plugins true
          composer config policy.advisories.block false

      - if: steps.build_drupal_cache.outputs.cache-hit != 'true'
        name: Install Drupal core dependencies
        run: composer --no-interaction --no-progress --prefer-dist --optimize-autoloader install

      - # Deliberately not gated on the cache hit above - see the matching
        # step in static_analysis_matrix for why. Also installs
        # brianium/paratest at the site root now, alongside core-dev -
        # paratest is a CI-only speed optimization (parallelizes test
        # runs), never needed for local development, so it's no longer
        # one of the module's own require-dev dependencies. Installing it
        # here means it's always paired with whatever phpunit core-dev
        # itself resolves for this specific Drupal version, rather than
        # the module maintaining its own independent, often-mismatched
        # lock.
        name: Install drupal/core-dev with dependencies
        run: |
          composer --no-interaction --no-progress require --dev \
          drupal/core-dev:${{ matrix.drupal-core }} \
          phpspec/prophecy-phpunit:^2 \
          brianium/paratest --with-all-dependencies

      - name: Checkout module
        uses: actions/checkout@v2
        with:
          path: modules/test_support

      - # Deliberately keyed by this matrix cell's own PHP version, not
        # just the lock hash - see the matching comment on sanity_check
        # for the bug this fixes (a cache built and validated on one PHP
        # version silently trusted on another, masking Composer platform
        # requirement violations specific to this cell's own PHP).
        id: module_vendor_cache
        name: Retreive module build cache
        uses: actions/cache@v3
        with:
          path: modules/test_support/vendor
          key: ${{ runner.os }}-module-vendor-composer-php${{ matrix.php-versions }}-${{ hashFiles('modules/test_support/composer.lock') }}
          restore-keys: ${{ runner.os }}-module-vendor-composer-php${{ matrix.php-versions }}-

      - if: steps.module_vendor_cache.outputs.cache-hit != 'true'
        name: Build module including dependencies
        run: |
          cd modules/test_support;
          composer --no-interaction --no-progress --prefer-dist --optimize-autoloader install

      - # Runs via the site root's own paratest (installed above,
        # alongside core-dev) rather than the module's own vendor - see
        # the comment on the install step above for why. The positional
        # path argument (not --path) is required for compatibility across
        # the full range of paratest versions Composer may resolve here,
        # since newer paratest releases dropped the --path option.
        name: Tests
        run: |
            vendor/bin/paratest \
            -c modules/test_support/phpunit.xml \
            --runner WrapperRunner \
            modules/test_support/tests

  drupal-11-matrix:
    name: Drupal ${{ matrix.drupal-core }} - PHP ${{ matrix.php-versions }}
    runs-on: ubuntu-latest
    needs: [ sanity_check, static_analysis_matrix ]
    strategy:
      fail-fast: false
      matrix:
        drupal-core: [ '11.0.0', '11.1.0', '11.2.0', '11.3.0', '11.4.0' ]
        php-versions: [ '8.3', '8.4' ]
    steps:
      - name: Setup PHP v${{ matrix.php-versions }}, with composer and extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          coverage: none

      - name: Checkout Drupal core v${{ matrix.drupal-core }}
        uses: actions/checkout@v2
        with:
          repository: drupal/drupal
          ref: ${{ matrix.drupal-core }}

      - name: Cache Drupal v${{ matrix.drupal-core }}
        id: build_drupal_cache
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-drupal-build-composer-v${{ matrix.drupal-core }}-${{ hashFiles('./composer.lock') }}
          restore-keys: ${{ runner.os }}-drupal-build-composer-v

      - # Always runs, cache hit or not - see the matching step in
        # static_analysis_matrix for why.
        name: Allow Composer plugins (older Drupal core composer.json predates allow-plugins)
        run: |
          composer config allow-plugins true
          composer config policy.advisories.block false

      - if: steps.build_drupal_cache.outputs.cache-hit != 'true'
        name: Install Drupal core dependencies
        run: composer --no-interaction --no-progress --prefer-dist --optimize-autoloader install

      - # Deliberately not gated on the cache hit above - see the matching
        # step in static_analysis_matrix for why. Also installs
        # brianium/paratest at the site root now, alongside core-dev -
        # paratest is a CI-only speed optimization (parallelizes test
        # runs), never needed for local development, so it's no longer
        # one of the module's own require-dev dependencies. Installing it
        # here means it's always paired with whatever phpunit core-dev
        # itself resolves for this specific Drupal version, rather than
        # the module maintaining its own independent, often-mismatched
        # lock. This is specifically what fixes Drupal 11: no single
        # module-locked phpunit version can satisfy core's own
        # PhpUnit10/PhpUnit11 compatibility shim split across 11.0-11.4.
        name: Install drupal/core-dev with dependencies
        run: |
          composer --no-interaction --no-progress require --dev \
          drupal/core-dev:${{ matrix.drupal-core }} \
          phpspec/prophecy-phpunit:^2 \
          brianium/paratest --with-all-dependencies

      - name: Checkout module
        uses: actions/checkout@v2
        with:
          path: modules/test_support

      - # Deliberately keyed by this matrix cell's own PHP version, not
        # just the lock hash - see the matching comment on sanity_check
        # for the bug this fixes (a cache built and validated on one PHP
        # version silently trusted on another, masking Composer platform
        # requirement violations specific to this cell's own PHP).
        id: module_vendor_cache
        name: Retreive module build cache
        uses: actions/cache@v3
        with:
          path: modules/test_support/vendor
          key: ${{ runner.os }}-module-vendor-composer-php${{ matrix.php-versions }}-${{ hashFiles('modules/test_support/composer.lock') }}
          restore-keys: ${{ runner.os }}-module-vendor-composer-php${{ matrix.php-versions }}-

      - if: steps.module_vendor_cache.outputs.cache-hit != 'true'
        name: Build module including dependencies
        run: |
          cd modules/test_support;
          composer --no-interaction --no-progress --prefer-dist --optimize-autoloader install

      - # Runs via the site root's own paratest (installed above,
        # alongside core-dev) rather than the module's own vendor - see
        # the comment on the install step above for why. The positional
        # path argument (not --path) is required for compatibility across
        # the full range of paratest versions Composer may resolve here,
        # since newer paratest releases dropped the --path option.
        name: Tests
        run: |
            vendor/bin/paratest \
            -c modules/test_support/phpunit.xml \
            --runner WrapperRunner \
            modules/test_support/tests

  drupal-12-matrix:
    name: Drupal ${{ matrix.drupal-core }} - PHP ${{ matrix.php-versions }}
    runs-on: ubuntu-latest
    needs: [ sanity_check, static_analysis_matrix ]
    strategy:
      fail-fast: false
      matrix:
        # Drupal 12.0.0 isn't released yet - see the matching comment in
        # static_analysis_matrix. 12.0.0-rc1 is the only installable tag
        # right now, so there's no minor range to cover yet the way
        # 9.x/10.x/11.x each have one.
        drupal-core: [ '12.0.0-rc1' ]
