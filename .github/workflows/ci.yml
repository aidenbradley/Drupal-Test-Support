      - # Deliberately not gated on the cache hit above - see the matching
        # step in static_analysis_matrix for why. Also installs
        # brianium/paratest at the site root now, alongside core-dev -
        # see the matching step in drupal-11-matrix for why.
        name: Install drupal/core-dev with dependencies
        run: |
          composer --no-interaction --no-progress require --dev \
          drupal/core-dev:${{ matrix.drupal-core }} \
          phpspec/prophecy-phpunit:^2 \
          brianium/paratest --with-all-dependencies

      - name: Checkout module
        uses: actions/checkout@v2
        with:
          path: modules/test_support

      - # Deliberately keyed by this matrix cell's own PHP version, not
        # just the lock hash - see the matching comment on sanity_check.
        id: module_vendor_cache
        name: Retreive module build cache
        uses: actions/cache@v3
        with:
          path: modules/test_support/vendor
          key: ${{ runner.os }}-module-vendor-composer-php${{ matrix.php-versions }}-${{ hashFiles('modules/test_support/composer.lock') }}
          restore-keys: ${{ runner.os }}-module-vendor-composer-php${{ matrix.php-versions }}-

      - if: steps.module_vendor_cache.outputs.cache-hit != 'true'
        name: Build module including dependencies
        run: |
          cd modules/test_support;
          composer --no-interaction --no-progress --prefer-dist --optimize-autoloader install

      - # Runs via the site root's own paratest (installed above,
        # alongside core-dev) rather than the module's own vendor - see
        # the matching step in drupal-11-matrix for why.
        name: Tests
        run: |
            vendor/bin/paratest \
            -c modules/test_support/phpunit.xml \
            --runner WrapperRunner \
            modules/test_support/tests

  drupal-9-matrix:
    name: Drupal ${{ matrix.drupal-core }} - PHP ${{ matrix.php-versions }}
    runs-on: ubuntu-latest
    needs: [ sanity_check, static_analysis_matrix ]
    strategy:
      fail-fast: false
      matrix:
        drupal-core: [ '9.1.0', '9.2.0', '9.3.0', '9.4.0', '9.5.0' ]
        php-versions: [ '7.3' ]
    steps:
      - name: Setup PHP v${{ matrix.php-versions }}, with composer and extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          coverage: none

      - name: Checkout Drupal core v${{ matrix.drupal-core }}
        uses: actions/checkout@v2
        with:
          repository: drupal/drupal
          ref: ${{ matrix.drupal-core }}

      - name: Cache Drupal v${{ matrix.drupal-core }}
        id: build_drupal_cache
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-drupal-build-composer-v${{ matrix.drupal-core }}-${{ hashFiles('./composer.lock') }}
          restore-keys: ${{ runner.os }}-drupal-build-composer-v

      - # Always runs, cache hit or not - see the matching step in
        # static_analysis_matrix for why.
        name: Allow Composer plugins (older Drupal core composer.json predates allow-plugins)
        run: |
          composer config allow-plugins true
          composer config policy.advisories.block false

      - if: steps.build_drupal_cache.outputs.cache-hit != 'true'
        name: Install Drupal core dependencies
        run: composer --no-interaction --no-progress --prefer-dist --optimize-autoloader install

      - # Deliberately not gated on the cache hit above - see the matching
        # step in static_analysis_matrix for why. Also installs
        # brianium/paratest at the site root now, alongside core-dev -
        # paratest is a CI-only speed optimization (parallelizes test
        # runs), never needed for local development, so it's no longer
        # one of the module's own require-dev dependencies. Installing it
        # here means it's always paired with whatever phpunit core-dev
        # itself resolves for this specific Drupal version, rather than
        # the module maintaining its own independent, often-mismatched
        # lock.
        name: Install drupal/core-dev with dependencies
        run: |
            composer --no-interaction --no-progress require --dev \
            drupal/core-dev:${{ matrix.drupal-core }} \
            phpspec/prophecy-phpunit:^2 \
            brianium/paratest --with-all-dependencies

      - name: Checkout module
        uses: actions/checkout@v2
        with:
          path: modules/test_support

      - # Deliberately keyed by this matrix cell's own PHP version, not
        # just the lock hash - see the matching comment on sanity_check
        # for the bug this fixes (a cache built and validated on one PHP
        # version silently trusted on another, masking Composer platform
        # requirement violations specific to this cell's own PHP).
        id: module_vendor_cache
        name: Retreive module build cache
        uses: actions/cache@v3
        with:
          path: modules/test_support/vendor
          key: ${{ runner.os }}-module-vendor-composer-php${{ matrix.php-versions }}-${{ hashFiles('modules/test_support/composer.lock') }}
          restore-keys: ${{ runner.os }}-module-vendor-composer-php${{ matrix.php-versions }}-

      - if: steps.module_vendor_cache.outputs.cache-hit != 'true'
        name: Build module including dependencies
        run: |
            cd modules/test_support;
            composer --no-interaction --no-progress --prefer-dist --optimize-autoloader install

      - # Runs via the site root's own paratest (installed above,
        # alongside core-dev) rather than the module's own vendor - see
        # the comment on the install step above for why. The positional
        # path argument (not --path) is required for compatibility across
        # the full range of paratest versions Composer may resolve here,
        # since newer paratest releases dropped the --path option.
        name: Tests
        run: |
            vendor/bin/paratest \
            -c modules/test_support/phpunit.xml \
            --runner WrapperRunner \
            modules/test_support/tests
