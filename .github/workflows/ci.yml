name: Test
on: [push]

jobs:
  build_production_module:
    name: Build Production Module
    runs-on: ubuntu-latest
    steps:
      - name: Checkout module
        uses: actions/checkout@v2
        with:
          path: modules/test_support

      - name: Cache module - Production Build
        id: build_production_module_cache
        uses: actions/cache@v3
        with:
          path: modules/test_support/vendor
          key: ${{ runner.os }}-build-production-module-composer-${{ hashFiles('modules/test_support/composer.lock') }}
          restore-keys: ${{ runner.os }}-build-production-module-composer-

      - if: steps.build_production_module_cache.outputs.cache-hit != 'true'
        name: Build production module including dependencies
        run: |
          cd modules/test_support
          composer --no-interaction --no-progress --prefer-dist --optimize-autoloader --no-dev install

  build_development_module:
    name: Build Development Module
    runs-on: ubuntu-latest
    steps:
      - name: Checkout module
        uses: actions/checkout@v2
        with:
          path: modules/test_support

      - name: Cache module - Development Build
        id: build_development_module_cache
        uses: actions/cache@v3
        with:
          path: modules/test_support/vendor
          key: ${{ runner.os }}-build-development-module-composer-${{ hashFiles('modules/test_support/composer.lock') }}
          restore-keys: ${{ runner.os }}-build-development-module-composer-

      - if: steps.build_development_module_cache.outputs.cache-hit != 'true'
        name: Build development module including dependencies
        run: |
          cd modules/test_support
          composer --no-interaction --no-progress --prefer-dist --optimize-autoloader install

  sanity_check:
    name: Sanity Check - Lint
    runs-on: ubuntu-latest
    needs: build_development_module
    strategy:
      matrix:
        php-version: ['7.3']
    steps:
      - name: Setup PHP v${{ matrix.php-version }}, with composer and extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: Checkout module
        uses: actions/checkout@v2
        with:
          path: modules/test_support

      - name: Retrieve module build cache
        uses: actions/cache@v3
        with:
          path: modules/test_support/vendor
          key: ${{ runner.os }}-build-development-module-composer-${{ hashFiles('modules/test_support/composer.lock') }}
          restore-keys: ${{ runner.os }}-build-development-module-composer-
          fail-on-cache-miss: true

      - name: PHP Mess Detector
        uses: php-actions/phpmd@v1
        with:
          php_version: ${{ matrix.php-version }}
          path: modules/test_support/tests/src/Traits
          output: ansi
          ruleset: modules/test_support/phpmd.xml

      - name: PHP Code Smells
        run: |
          cd modules/test_support
          composer test:code-smells

  static_analysis_matrix:
    name: PHPStan - Static Analysis
    runs-on: ubuntu-latest
    needs: build_development_module
    strategy:
      fail-fast: false
      matrix:
        include:
          # Drupal 9.1.x
          - drupal-version: 9.1.0
            php-version: 7.3
          - drupal-version: 9.1.0
            php-version: 7.4
          - drupal-version: 9.1.0
            php-version: 8.0
          - drupal-version: 9.1.0
            php-version: 8.1
          - drupal-version: 9.1.0
            php-version: 8.2
          # Drupal 9.2.x
          - drupal-version: 9.2.0
            php-version: 7.4
          - drupal-version: 9.2.0
            php-version: 8.0
          - drupal-version: 9.2.0
            php-version: 8.1
          - drupal-version: 9.2.0
            php-version: 8.2
          # Drupal 9.3.x
          - drupal-version: 9.3.0
            php-version: 8.0
          - drupal-version: 9.3.0
            php-version: 8.1
          - drupal-version: 9.3.0
            php-version: 8.2
          # Drupal 9.4.x
          - drupal-version: 9.4.0
            php-version: 8.0
          - drupal-version: 9.4.0
            php-version: 8.1
          - drupal-version: 9.4.0
            php-version: 8.2
          # Drupal 9.5.x
          - drupal-version: 9.5.0
            php-version: 8.0
          - drupal-version: 9.5.0
            php-version: 8.1
          - drupal-version: 9.5.0
            php-version: 8.2
          # Drupal 10.0.x
          - drupal-version: 10.0.0
            php-version: 8.1
          - drupal-version: 10.0.0
            php-version: 8.2
          # Drupal 10.1.x
          - drupal-version: 10.1.0
            php-version: 8.1
          - drupal-version: 10.1.0
            php-version: 8.2
          # Drupal 10.2.x
          - drupal-version: 10.2.0
            php-version: 8.1
          - drupal-version: 10.2.0
            php-version: 8.2
          # Drupal 10.3.x
          - drupal-version: 10.3.0
            php-version: 8.1
          - drupal-version: 10.3.0
            php-version: 8.2
          # Drupal 10.4.x
          - drupal-version: 10.4.0
            php-version: 8.2
          - drupal-version: 10.4.0
            php-version: 8.3
          - drupal-version: 10.4.0
            php-version: 8.4
          # Drupal 10.5.x
          - drupal-version: 10.5.0
            php-version: 8.2
          - drupal-version: 10.5.0
            php-version: 8.3
          - drupal-version: 10.5.0
            php-version: 8.4
          # Drupal 11.0.x
          - drupal-version: 11.0.0
            php-version: 8.3
          - drupal-version: 11.0.0
            php-version: 8.4
          # Drupal 11.1.x
          - drupal-version: 11.1.0
            php-version: 8.3
          - drupal-version: 11.1.0
            php-version: 8.4
          # Drupal 11.2.x
          - drupal-version: 11.2.0
            php-version: 8.3
          - drupal-version: 11.2.0
            php-version: 8.4
    steps:
      - name: Setup PHP v${{ matrix.php-version }}, with composer and extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: Checkout Drupal core v${{ matrix.drupal-version }}
        uses: actions/checkout@v2
        with:
          repository: drupal/drupal
          ref: ${{ matrix.drupal-version }}

      - name: Cache Drupal v${{ matrix.drupal-version }}
        id: build_drupal_cache
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-drupal-build-composer-v${{ matrix.drupal-version }}-${{ hashFiles('./composer.lock') }}
          restore-keys: ${{ runner.os }}-drupal-build-composer-v

      - if: steps.build_drupal_cache.outputs.cache-hit != 'true'
        name: Build Drupal v${{ matrix.drupal-version }}
        run: |
          composer --no-interaction --no-progress --prefer-dist --optimize-autoloader --no-dev install

      - name: Checkout module
        uses: actions/checkout@v2
        with:
          path: modules/test_support

      - name: Retrieve module build cache
        uses: actions/cache@v3
        with:
          path: modules/test_support/vendor
          key: ${{ runner.os }}-build-development-module-composer-${{ hashFiles('modules/test_support/composer.lock') }}
          restore-keys: ${{ runner.os }}-build-development-module-composer-

      - name: Run PHPStan analysis
        run: |
          vendor/bin/phpstan analyse modules/test_support/src modules/test_support/tests
